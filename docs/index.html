<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지환이의 신나는 놀이방</title>
<meta name="theme-color" content="#bde8ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="지환이 놀이방">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)&&!window.Capacitor){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
<style>
@font-face{font-family:"Jua";src:url(fonts/Jua.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Gowun Dodum";src:url(fonts/GowunDodum.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
:root{
  --ink:#27305a; --muted:#6a7399; --card:#ffffff; --line:#e4e9f7; --shadow:0 6px 0 rgba(39,48,90,.12),0 14px 28px rgba(39,48,90,.12);
  --ko:#ff8a3d; --ko2:#ffb347; --ko-soft:#fff0df; --en:#2f9bff; --en2:#37d0c4; --en-soft:#e3f3ff;
  --good:#2fbf71; --good-soft:#dff8ea; --bad:#ff6b6b; --warn:#ffc93c; --purple:#8e6cf0;
  --r:26px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Gowun Dodum","Noto Sans KR",system-ui,sans-serif;color:var(--ink);background:linear-gradient(#bde8ff 0%,#e8f6ff 55%,#fff6df 100%);overflow-x:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
button:focus-visible{outline:4px solid #7aa8ff;outline-offset:2px}
.jua,h1,h2,h3,.big,.tile,.opt,.slot,.pill,.gtitle{font-family:"Jua","Gowun Dodum",sans-serif}
#app{max-width:1000px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:max(env(safe-area-inset-top),8px) 14px max(env(safe-area-inset-bottom),14px)}
#bar{display:flex;align-items:center;gap:10px;padding:6px 0 10px}
#ttl{flex:1;font-family:"Jua",sans-serif;font-size:clamp(20px,4.6vw,30px);text-align:center;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:52px;height:52px;border-radius:18px;background:#fff;box-shadow:0 4px 0 rgba(39,48,90,.14);font-size:24px;display:grid;place-items:center;flex:none}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(39,48,90,.14)}
.ib[hidden]{display:none}
#starbox{background:#fff;border-radius:18px;padding:0 14px;height:52px;display:flex;align-items:center;gap:6px;font-family:"Jua",sans-serif;font-size:24px;box-shadow:0 4px 0 rgba(39,48,90,.14);flex:none}
#view{flex:1;display:flex;flex-direction:column;min-height:0}
.hidden{display:none!important}

/* 마스코트와 말풍선 */
.mrow{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.mascot{font-size:clamp(70px,16vw,104px);line-height:1;flex:none;filter:drop-shadow(0 6px 0 rgba(39,48,90,.12));animation:bob 3s ease-in-out infinite}
.bubble{position:relative;background:#fff;border-radius:22px;padding:14px 18px;font-size:clamp(17px,3.8vw,22px);line-height:1.4;box-shadow:0 5px 0 rgba(39,48,90,.1);flex:1}
.bubble:before{content:"";position:absolute;left:-10px;top:26px;border:10px solid transparent;border-right-color:#fff;border-left:0}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* 처음 화면 */
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.worlds{grid-template-columns:1fr}}
.wcard{border-radius:34px;padding:22px 22px 20px;color:#fff;text-align:left;position:relative;overflow:hidden;box-shadow:0 8px 0 rgba(39,48,90,.2),0 18px 30px rgba(39,48,90,.16);min-height:180px;display:flex;flex-direction:column;justify-content:space-between}
.wcard:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(39,48,90,.2)}
.wcard.ko{background:linear-gradient(135deg,#ff7a45,#ffb347)}
.wcard.en{background:linear-gradient(135deg,#2f8bff,#37d0c4)}
.wcard .wt{font-family:"Jua",sans-serif;font-size:clamp(34px,7vw,46px);line-height:1.1;text-shadow:0 3px 0 rgba(0,0,0,.14)}
.wcard .ws{font-size:clamp(17px,3.6vw,22px);opacity:.95;margin-top:6px}
.wcard .wbig{position:absolute;right:14px;top:6px;font-family:"Jua",sans-serif;font-size:96px;opacity:.28;line-height:1;pointer-events:none}
.wcard .wlv{align-self:flex-start;background:rgba(255,255,255,.28);border-radius:99px;padding:6px 14px;font-family:"Jua",sans-serif;font-size:18px;margin-top:14px}
.sbtn{margin-top:16px;width:100%;background:#fff;border-radius:26px;padding:16px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 0 rgba(39,48,90,.12);font-family:"Jua",sans-serif;font-size:24px}
.sbtn small{font-family:"Gowun Dodum",sans-serif;font-size:17px;color:var(--muted);margin-left:auto}
.sbtn:active{transform:translateY(3px)}

/* 게임 고르기 */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.gcard{background:#fff;border-radius:28px;padding:16px 18px;display:flex;align-items:center;gap:14px;text-align:left;box-shadow:var(--shadow);border:4px solid transparent}
.gcard.ko{border-color:var(--ko2)}.gcard.en{border-color:#8ccfff}
.gcard:active{transform:translateY(3px)}
.gcard .gi{font-size:44px;width:68px;height:68px;border-radius:22px;display:grid;place-items:center;flex:none}
.gcard.ko .gi{background:var(--ko-soft)}.gcard.en .gi{background:var(--en-soft)}
.gtitle{font-size:clamp(21px,4.4vw,25px);line-height:1.15}
.gsub{font-size:16px;color:var(--muted);margin-top:3px;line-height:1.3}
.glv{margin-top:6px;display:flex;gap:4px;align-items:center}
.glv i{width:12px;height:12px;border-radius:50%;background:#dfe5f5;display:block}
.glv i.on{background:var(--warn)}
.glv span{font-family:"Jua",sans-serif;font-size:15px;color:var(--muted);margin-left:6px}

/* 문제 화면 */
.dots{display:flex;gap:7px;justify-content:center;margin:2px 0 12px;flex-wrap:wrap}
.dots i{width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px #cfd8f2;display:block}
.dots i.done{background:var(--good);box-shadow:none}.dots i.miss{background:#ffb4b4;box-shadow:none}.dots i.cur{background:var(--warn);box-shadow:none;transform:scale(1.25)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;padding-bottom:8px}
.prompt{font-family:"Jua",sans-serif;font-size:clamp(22px,5vw,30px);text-align:center;line-height:1.3}
.prompt small{display:block;font-family:"Gowun Dodum",sans-serif;font-size:clamp(15px,3.4vw,18px);color:var(--muted);margin-top:4px}
.speak{background:#fff;border-radius:30px;padding:10px 22px;display:flex;align-items:center;gap:10px;font-family:"Jua",sans-serif;font-size:22px;box-shadow:0 5px 0 rgba(39,48,90,.14)}
.speak:active{transform:translateY(3px)}
.speak b{font-size:34px}
.big{font-size:clamp(90px,26vw,170px);line-height:1;text-shadow:0 5px 0 rgba(0,0,0,.08)}
.pic{font-size:clamp(84px,24vw,140px);line-height:1;filter:drop-shadow(0 6px 0 rgba(39,48,90,.12))}
.card{background:#fff;border-radius:34px;box-shadow:var(--shadow);padding:16px 26px;text-align:center}
.opts{display:grid;gap:14px;width:100%;max-width:640px;grid-template-columns:repeat(2,1fr)}
.opts.n3{grid-template-columns:repeat(3,1fr)}.opts.n4{grid-template-columns:repeat(2,1fr)}
@media (min-width:700px){.opts.n4{grid-template-columns:repeat(4,1fr)}}
.opt{background:#fff;border-radius:30px;min-height:clamp(110px,26vw,160px);font-size:clamp(54px,14vw,86px);display:grid;place-items:center;box-shadow:0 8px 0 rgba(39,48,90,.16);border:5px solid #fff;line-height:1}
.opt.pic{font-size:clamp(60px,15vw,96px)}
.opt:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(39,48,90,.16)}
.opt.ok{background:var(--good-soft);border-color:var(--good);animation:pop .5s}
.opt.hint{border-color:var(--warn);animation:glow 1s infinite}
.opt.off{opacity:.35;pointer-events:none}
.shake{animation:shake .42s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes glow{50%{box-shadow:0 0 0 10px rgba(255,201,60,.55),0 8px 0 rgba(39,48,90,.16)}}

/* 칸과 타일 (낱말·문장 만들기, 글자 만들기) */
.slots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:98px}
.slot{min-width:clamp(70px,18vw,100px);height:clamp(84px,20vw,112px);border-radius:24px;border:5px dashed #b9c4ea;background:rgba(255,255,255,.65);display:grid;place-items:center;font-size:clamp(42px,11vw,62px);padding:0 10px;color:var(--ink)}
.slot.w{min-width:auto;font-size:clamp(26px,6.4vw,38px);height:clamp(64px,14vw,80px);padding:0 16px}
.slot.on{border:5px solid var(--good);background:var(--good-soft);animation:pop .4s}
.slot.ghost{color:#c5cce6}
.slot.cur{border-color:var(--warn);background:#fff8dd}
.tiles{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;max-width:680px}
.tile{min-width:clamp(76px,19vw,104px);height:clamp(84px,20vw,112px);border-radius:26px;background:#fff;font-size:clamp(42px,11vw,62px);box-shadow:0 7px 0 rgba(39,48,90,.16);display:grid;place-items:center;padding:0 12px;border:4px solid #fff;position:relative}
.tile.w{min-width:auto;font-size:clamp(24px,6vw,36px);height:clamp(62px,14vw,76px);padding:0 18px}
.tile:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(39,48,90,.16)}
.tile.used{visibility:hidden}
.tile.hint{border-color:var(--warn);animation:glow 1s infinite}
.tile small{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-family:"Gowun Dodum",sans-serif;font-size:15px;color:var(--muted)}
.tile.c{color:#e8590c}.tile.v{color:#2b78e4}
.slot.c{color:#e8590c}.slot.v{color:#2b78e4}
.eq{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:nowrap}
.eq .op{font-family:"Jua",sans-serif;font-size:clamp(34px,8vw,48px);color:var(--muted)}
.res{min-width:clamp(96px,24vw,132px);height:clamp(96px,24vw,132px);border-radius:30px;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;font-size:clamp(60px,15vw,88px)}
.res.q{color:#c5cce6}
.res.on{background:var(--good-soft);color:var(--ink);animation:pop .55s}
.wordline{font-family:"Jua",sans-serif;font-size:clamp(38px,10vw,64px);letter-spacing:.04em;text-align:center}
.meaning{font-size:clamp(17px,4vw,22px);color:var(--muted);text-align:center}
.bank{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
.row-label{font-family:"Jua",sans-serif;font-size:18px;color:var(--muted)}
.btnrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.pill{display:inline-block;background:#fff;border-radius:99px;padding:8px 18px;font-size:19px;box-shadow:0 4px 0 rgba(39,48,90,.12)}
.sm{background:#fff;border-radius:22px;padding:10px 18px;font-family:"Jua",sans-serif;font-size:20px;box-shadow:0 5px 0 rgba(39,48,90,.14);display:inline-flex;align-items:center;gap:8px}
.sm:active{transform:translateY(3px)}
.sm.pri{background:var(--ko);color:#fff}.sm.en{background:var(--en);color:#fff}

/* 짝 맞추기 */
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px;width:100%;max-width:520px}
.match .opt{min-height:96px;font-size:clamp(44px,12vw,64px)}
.match .opt.sel{border-color:var(--warn);background:#fff8dd}
.match .opt.ok{pointer-events:none}

/* 소리 배우기 */
.seg{display:flex;background:#fff;border-radius:22px;padding:5px;gap:5px;box-shadow:0 4px 0 rgba(39,48,90,.12)}
.seg button{padding:10px 26px;border-radius:17px;font-family:"Jua",sans-serif;font-size:22px;color:var(--muted)}
.seg button.on{background:var(--ko);color:#fff}
.seg.en button.on{background:var(--en)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px;width:100%}
.lcell{background:#fff;border-radius:22px;height:84px;font-family:"Jua",sans-serif;font-size:42px;box-shadow:0 5px 0 rgba(39,48,90,.14);display:grid;place-items:center;border:4px solid #fff;position:relative}
.lcell.on{border-color:var(--ko)}.lcell.en.on{border-color:var(--en)}
.lcell:active{transform:translateY(3px)}
.lcell small{position:absolute;right:6px;bottom:2px;font-size:20px}
.combos{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:620px}
.combo{background:var(--ko-soft);border-radius:18px;min-width:66px;height:66px;display:grid;place-items:center;font-family:"Jua",sans-serif;font-size:36px;box-shadow:0 4px 0 rgba(39,48,90,.12)}
.combo:active{transform:translateY(3px)}
.hero{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
.hero .big{font-size:clamp(100px,28vw,170px)}
.hero .cap{font-family:"Jua",sans-serif;font-size:clamp(26px,6vw,34px);text-align:left;line-height:1.35}
.hero .cap small{display:block;font-family:"Gowun Dodum",sans-serif;font-size:20px;color:var(--muted)}
.nav{display:flex;gap:14px;align-items:center;justify-content:center}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:44px;background:#fff;box-shadow:var(--shadow)}
.ring.go{animation:ringp 1s infinite}
@keyframes ringp{0%{box-shadow:0 0 0 0 rgba(255,138,61,.6),var(--shadow)}100%{box-shadow:0 0 0 26px rgba(255,138,61,0),var(--shadow)}}

/* 결과 */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:6px}
.stars3{font-size:clamp(56px,16vw,92px);letter-spacing:6px}
.stars3 .off{filter:grayscale(1);opacity:.3}
.stars3 span{display:inline-block;animation:pop .6s both}
.stars3 span:nth-child(2){animation-delay:.18s}.stars3 span:nth-child(3){animation-delay:.36s}
.lvmsg{background:#fff;border-radius:24px;padding:12px 20px;font-size:20px;box-shadow:0 5px 0 rgba(39,48,90,.12);max-width:520px}
.lvmsg b{font-family:"Jua",sans-serif}
.newstk{font-size:80px;animation:bob 1.6s infinite}

/* 스티커 */
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px}
.stk div{background:#fff;border-radius:24px;height:88px;display:grid;place-items:center;font-size:50px;box-shadow:0 5px 0 rgba(39,48,90,.12)}
.stk div.lock{background:rgba(255,255,255,.5);box-shadow:none;font-size:32px;filter:grayscale(1);opacity:.55}
.stk div.new{animation:pop .7s;border:4px solid var(--warn)}

/* 부모님 */
.panel{background:#fff;border-radius:26px;padding:18px 20px;box-shadow:0 5px 0 rgba(39,48,90,.1);margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:24px}
.panel p{margin:6px 0;color:var(--muted);line-height:1.5;font-size:17px}
.panel label{display:flex;align-items:center;gap:10px;margin:10px 0 4px;font-family:"Jua",sans-serif;font-size:19px}
.panel select,.panel input[type=text]{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:16px;border:3px solid var(--line);background:#fff;color:var(--ink)}
.panel input[type=range]{width:100%}
.lvrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:2px dashed var(--line)}
.lvrow:first-of-type{border-top:0}
.lvrow .nm{flex:1;font-family:"Jua",sans-serif;font-size:19px}
.lvrow select{width:auto;padding:8px 10px;font-size:17px}
.gate{max-width:460px;margin:30px auto;text-align:center}
.gate .opts{grid-template-columns:repeat(2,1fr)}
.warn{color:#d9480f}

/* 효과 */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.pt{position:absolute;font-size:34px;transition:transform .9s cubic-bezier(.2,.7,.3,1),opacity .9s;will-change:transform}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:#27305a;color:#fff;padding:12px 22px;border-radius:99px;font-size:18px;z-index:40;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.nav .speak{white-space:nowrap;padding:10px 18px}
@media (max-width:440px){.ring{width:74px;height:74px;font-size:34px}.nav{gap:8px}.nav .ib{width:46px;height:46px}.nav .speak{font-size:20px;padding:8px 14px}.nav .speak b{font-size:28px}}
.match .opt.up{background:#fff3e6}.match .opt.low{background:#e8f3ff}
.match .opt.up.ok,.match .opt.low.ok{background:var(--good-soft)}

.notice{display:block;width:100%;background:#fff3cd;border:3px solid #ffc93c;border-radius:20px;padding:12px 16px;margin:-4px 0 14px;font-family:"Jua",sans-serif;font-size:19px;text-align:left;color:#7a5a00}
.panel details{border-top:2px dashed var(--line);padding:8px 0}
.panel summary{font-family:"Jua",sans-serif;font-size:19px;cursor:pointer;padding:6px 0}
.panel details p{margin:4px 0 4px 6px}

</style>
</head>
<body>
<div id="app">
<header id="bar"><button id="back" class="ib" aria-label="뒤로" hidden>◀</button><div id="ttl">지환이의 신나는 놀이방</div><div id="starbox">⭐ <b id="stars">0</b></div><button id="gear" class="ib" aria-label="부모님 설정">⚙️</button></header>
<main id="view"></main></div><div id="fx" aria-hidden="true"></div><div id="toast" hidden></div>
<script>
// ============================================================
//  지환이의 신나는 놀이방 v3 — 핵심 규칙 (화면과 상관없는 부분)
//  한글 글자 조합, 낱말·문장 자료, 단계별 문제 만들기, 자동 난이도, 목소리 고르기
// ============================================================
(function(root){
'use strict';

// ---------- 한글 글자 만들기 ----------
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function compose(c,v,j){
  const a=CHO.indexOf(c), b=JUNG.indexOf(v), d=JONG.indexOf(j||'');
  if(a<0||b<0||d<0) return '';
  return String.fromCharCode(0xAC00+(a*21+b)*28+d);
}
function decompose(ch){
  const n=ch.charCodeAt(0)-0xAC00; if(n<0||n>11171) return null;
  return {c:CHO[Math.floor(n/588)], v:JUNG[Math.floor((n%588)/28)], j:JONG[n%28]};
}
// 아이에게 들려줄 소리 (ㄱ → "그", ㅏ → "아"). 이름(기역, 니은)보다 소리를 먼저 가르쳐요.
const C_SOUND={'ㄱ':'그','ㄴ':'느','ㄷ':'드','ㄹ':'르','ㅁ':'므','ㅂ':'브','ㅅ':'스','ㅇ':'','ㅈ':'즈','ㅊ':'츠','ㅋ':'크','ㅌ':'트','ㅍ':'프','ㅎ':'흐'};

// ---------- 작은 도구 ----------
function rng(seed){ // 시험할 때 같은 결과를 얻으려고 쓰는 난수
  let s=(seed>>>0)||123456789;
  return function(){ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; };
}
let R=Math.random;
function setRandom(f){ R=f||Math.random; }
const pick=a=>a[Math.floor(R()*a.length)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function uniq(a){ return Array.from(new Set(a)); }

// ---------- 자동 난이도 ----------
// 한 판(문제 8개)이 끝나면 정확도를 보고 단계를 올리거나 내려요. 숫자만 늘리는 게 아니라 내용 자체가 바뀌어요.
const ROUND=8, MAXLV=5;
function itemWeight(st,key){ // 틀린 것은 자주, 잘 아는 것은 가끔 나오게
  const s=st&&st[key]; if(!s) return 3;
  const r=s.r||0, w=s.w||0; return Math.max(1,3+w*2-r);
}
function weightedPick(keys,stats,exclude){
  const pool=keys.filter(k=>!(exclude&&exclude.has(k))); const use=pool.length?pool:keys;
  let tot=0; const ws=use.map(k=>{ const x=itemWeight(stats,k); tot+=x; return x; });
  let t=R()*tot; for(let i=0;i<use.length;i++){ t-=ws[i]; if(t<=0) return use[i]; } return use[use.length-1];
}
function adjustLevel(prog,roundRight,roundTotal){
  // prog: {lv, hist:[정확도…]}  반환: {lv, change:'up'|'down'|'' }
  const acc=roundTotal?roundRight/roundTotal:0;
  const hist=(prog.hist||[]).concat([acc]).slice(-3);
  let lv=prog.lv||1, change='';
  if(hist.length>=2 && hist.slice(-2).every(a=>a>=.85) && lv<MAXLV){ lv++; change='up'; prog.hist=[]; }
  else if(acc<.45 && lv>1){ lv--; change='down'; prog.hist=[]; }
  else prog.hist=hist;
  prog.lv=lv; return {lv,change,acc};
}

// ---------- 문제 만들기: 한글 글자 찾기 (소리 듣고 고르기) ----------
function hgSyllablePool(lv){ const st=HG_STAGE[lv]; const out=[]; for(const c of st.c) for(const v of st.v){ const s=compose(c,v); out.push({s,c,v}); } return out; }
function hgChoiceQuestion(lv,stats,recent){
  const pool=hgSyllablePool(lv); const keys=pool.map(p=>p.s);
  const key=weightedPick(keys,stats,recent); const ans=pool.find(p=>p.s===key);
  const nOpt=[0,2,3,3,4,4][lv];
  const sameV=pool.filter(p=>p.v===ans.v&&p.s!==ans.s), sameC=pool.filter(p=>p.c===ans.c&&p.s!==ans.s), other=pool.filter(p=>p.c!==ans.c&&p.v!==ans.v);
  let dis=[];
  // 1·2단계: 모음이 같거나 완전히 다른 글자 / 3단계부터: 자음만 같은(모음 구분) 글자를 섞고 / 4~5단계: 비슷한 소리끼리
  if(lv===1) dis=shuffle(other);
  else if(lv===2) dis=shuffle(sameV).slice(0,1).concat(shuffle(other));
  else if(lv===3) dis=shuffle(sameC).slice(0,2).concat(shuffle(sameV).slice(0,1),shuffle(other));
  else dis=shuffle(sameC).slice(0,2).concat(shuffle(sameV).slice(0,2),shuffle(other));
  dis=uniq(dis.map(d=>d.s)).filter(s=>s!==ans.s).slice(0,nOpt-1);
  while(dis.length<nOpt-1){ const x=pick(pool).s; if(x!==ans.s&&!dis.includes(x)) dis.push(x); }
  return {kind:'choice',key:ans.s,answer:ans.s,options:shuffle([ans.s].concat(dis)),say:ans.s,hint:`${C_SOUND[ans.c]||''} ${V_SOUND[ans.v]} → ${ans.s}`,lv};
}
// 글자 합치기 문제: "ㅎ 과 ㅏ 가 만나면?"
function hgComposeQuestion(lv,stats,recent){
  const q=hgChoiceQuestion(lv,stats,recent); const d=decompose(q.answer);
  return Object.assign(q,{kind:'compose',c:d.c,v:d.v});
}

  async function one(text,lang,o,my){

})();

    else { mistaken.add(sel.dataset.v); wrongFx(b); Voice.seq([pick(TRYAGAIN)]); } });
