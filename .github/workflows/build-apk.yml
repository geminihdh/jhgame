# 안드로이드용 설치 파일(APK)을 GitHub에서 무료로 만들어 줘요.
# 사용법: 저장소의 Actions 탭 → "APK 만들기" → Run workflow. 끝나면 Releases에 APK가 올라와요.
name: APK 만들기

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'android/**'
      - 'package.json'
      - 'capacitor.config.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 도구 설치
        run: npm install --no-audit --no-fund

      - name: 웹 파일을 안드로이드 앱에 넣기
        run: npx cap sync android

      - name: 버전 번호 올리기 (설치된 앱 위에 업데이트하려면 매번 커져야 해요)
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: APK 만들기
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/debug/app-debug.apk jihwan-playroom.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jihwan-playroom-apk
          path: jihwan-playroom.apk

      - name: Releases에 올리기 (로그인 없이 받을 수 있는 링크가 생겨요)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 지환이의 신나는 놀이방 APK (빌드 ${{ github.run_number }})
          body: |
            안드로이드 폰·태블릿에 설치하는 파일이에요.
            아래 jihwan-playroom.apk 를 받아서 설치하세요. 설치 방법은 저장소의 README.md 를 보세요.
          files: jihwan-playroom.apk
