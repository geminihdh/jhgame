# 안드로이드 설치 파일(APK)을 GitHub에서 무료로 만들어 줘요.
# 파일을 올리면 자동으로 시작되고, Actions 탭에서 "Run workflow"로 다시 만들 수도 있어요.
# 끝나면 저장소 오른쪽의 Releases에 jihwan-playroom.apk 가 올라와요.
name: APK 만들기

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'assets/**'
      - 'scripts/**'
      - 'signing/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 도구 설치
        run: npm install --no-audit --no-fund

      - name: 안드로이드 프로젝트 만들기
        run: npx cap add android

      - name: 이 앱에 필요한 안드로이드 설정 넣기
        run: node scripts/prepare-android.mjs
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: 앱 아이콘과 시작 화면 만들기
        run: npx capacitor-assets generate --android

      - name: 웹 파일을 안드로이드 앱에 넣기
        run: npx cap sync android

      - name: APK 만들기
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/debug/app-debug.apk jihwan-playroom.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jihwan-playroom-apk
          path: jihwan-playroom.apk

      - name: Releases에 올리기 (로그인 없이 받을 수 있는 링크가 생겨요)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 지환이의 신나는 놀이방 APK (빌드 ${{ github.run_number }})
          body: |
            안드로이드 폰·태블릿에 설치하는 파일이에요.
            아래 jihwan-playroom.apk 를 받아서 설치하세요.
          files: jihwan-playroom.apk
